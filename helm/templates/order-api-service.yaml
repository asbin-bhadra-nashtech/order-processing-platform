apiVersion: v1
kind: Service
metadata:
  name: order-api
spec:
  type: {{ .Values.orderApi.service.type }}
  selector:
    app: order-api
  ports:
    - port: {{ .Values.orderApi.service.port }}
      targetPort: {{ .Values.orderApi.service.port }}
      nodePort: {{ .Values.orderApi.service.nodePort }}